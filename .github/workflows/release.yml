name: Build attestable release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:build
      - run: pnpm release:smoke
      - name: Attest package provenance with GitHub OIDC
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .statescry/release/packages/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: statescry-release-artifacts
          path: .statescry/release
          if-no-files-found: error

  # Publishing remains deliberately separate. After StateScry trademark and package
  # ownership are confirmed, a maintainer may add an environment-protected publish job
  # using NPM_TOKEN or npm trusted publishing.
